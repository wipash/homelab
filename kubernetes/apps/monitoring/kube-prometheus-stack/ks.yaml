---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
spec:
  targetNamespace: monitoring
  dependsOn:
    - name: external-secrets-stores
      namespace: kube-system
    - name: nfs-cache
      namespace: kube-system
    - name: synology-csi
      namespace: flux-system
    - name: volsync
      namespace: flux-system
  path: ./kubernetes/apps/monitoring/kube-prometheus-stack/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: alertmanager
      VOLSYNC_CLAIM: data-alertmanager-kube-prometheus-stack-0
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-nfs-cache
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "2000"
