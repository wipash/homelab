---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ../../../../templates/volsync
patches:
  - target:
      kind: Replication(Source|Destination)
    patch: |-
      - op: replace
        path: /spec/restic/storageClassName
        value: synology-iscsi-ephemeral
      - op: add
        path: /spec/restic/moverSecurityContext/fsGroupChangePolicy
        value: OnRootMismatch
  - target:
      kind: ReplicationDestination
    patch: |-
      - op: replace
        path: /spec/restic/cleanupTempPVC
        value: false
configMapGenerator:
  - name: smokeping-configmap
    files:
      - General=./config/General
      - Presentation=./config/Presentation
      - Targets=./config/Targets
      - Probes=./config/Probes
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
labels:
  - pairs:
      app.kubernetes.io/name: smokeping
      app.kubernetes.io/instance: smokeping
