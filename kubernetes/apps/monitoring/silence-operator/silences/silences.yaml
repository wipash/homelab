# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: cpu-throttling-high-mariadb
spec:
  matchers:
    - name: alertname
      value: CPUThrottlingHigh
    - name: container
      value: mariadb
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: cpu-throttling-high-memcached
spec:
  matchers:
    - name: alertname
      value: CPUThrottlingHigh
    - name: container
      value: memcached
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: kube-memory-overcommit
spec:
  matchers:
    - name: alertname
      value: KubeMemoryOvercommit
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: kube-pv-filling-up-prometheus
spec:
  matchers:
    - name: alertname
      value: KubePersistentVolumeFillingUp
    - name: persistentvolumeclaim
      value: prometheus-kube-prometheus-stack-db-prometheus-kube-prometheus-stack-0
