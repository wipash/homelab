---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
# The CephPoolGrowthWarning rule (rule_group "pools") fails evaluation for ~2 days
# after a rook-ceph-mgr pod restart: the [2d] lookback sees both the old and new
# pod's series for the same instance and errors with duplicate-series matching.
# Harmless and self-healing; silence the resulting PrometheusRuleFailures pages.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: prometheus-rule-failures-ceph-pools
spec:
  matchers:
    - name: alertname
      value: PrometheusRuleFailures
    - name: rule_group
      value: .*rook-ceph-prometheus-ceph-rules.*;pools
      matchType: "=~"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: cpu-throttling-high-mariadb
spec:
  matchers:
    - name: alertname
      value: CPUThrottlingHigh
    - name: container
      value: mariadb
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: cpu-throttling-high-memcached
spec:
  matchers:
    - name: alertname
      value: CPUThrottlingHigh
    - name: container
      value: memcached
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: kube-memory-overcommit
spec:
  matchers:
    - name: alertname
      value: KubeMemoryOvercommit
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: ceph-node-diskspace-warning
spec:
  matchers:
    - name: alertname
      value: CephNodeDiskspaceWarning
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: kube-pv-filling-up-prometheus
spec:
  matchers:
    - name: alertname
      value: KubePersistentVolumeFillingUp
    - name: persistentvolumeclaim
      value: prometheus-kube-prometheus-stack-db-prometheus-kube-prometheus-stack-0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
# KubeVirt fires LowKVMNodesCount whenever fewer than two nodes advertise
# devices.kubevirt.io/kvm. Only hp2 exposes hardware virtualization, and live
# migration is deliberately not configured, so this can never clear.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: low-kvm-nodes-count
spec:
  matchers:
    - name: alertname
      value: LowKVMNodesCount
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
# CDI cannot infer accessMode/volumeMode for openebs-hostpath because
# openebs.io/local is absent from its provisioner capability map, so that
# StorageProfile reports complete="false" permanently. Scoped to that one
# storage class so the alert still fires for ceph-block.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: cdi-storage-profiles-incomplete-openebs
spec:
  matchers:
    - name: alertname
      value: CDIStorageProfilesIncomplete
    - name: storageclass
      value: openebs-hostpath
