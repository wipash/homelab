---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafana.yaml
  - ./grafanadatasource.yaml
  - ./mutatingadmissionpolicy.yaml
  - ./servicemonitor.yaml
  - ./dashboards/default.yaml
  - ./dashboards/grafana-operator.yaml
  - ./dashboards/ceph.yaml
  - ./dashboards/kubernetes.yaml
  - ./dashboards/prometheus.yaml
  - ../../../../templates/volsync
patches:
  # Keep the application claim on Retain while deleting disposable mover volumes.
  - target:
      kind: Replication(Source|Destination)
    patch: |-
      - op: replace
        path: /spec/restic/storageClassName
        value: synology-iscsi-ephemeral
      - op: add
        path: /spec/restic/moverSecurityContext/fsGroupChangePolicy
        value: OnRootMismatch
  # Preserve the recovery staging claim for offline comparison and native checks.
  - target:
      kind: ReplicationDestination
    patch: |-
      - op: replace
        path: /spec/restic/cleanupTempPVC
        value: false
