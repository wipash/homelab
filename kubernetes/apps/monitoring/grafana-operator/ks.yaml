---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
spec:
  targetNamespace: monitoring
  path: ./kubernetes/apps/monitoring/grafana-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
spec:
  targetNamespace: monitoring
  dependsOn:
    - name: grafana-operator
    - name: nfs-cache
      namespace: kube-system
    - name: external-secrets-stores
      namespace: kube-system
    - name: synology-csi
      namespace: flux-system
    - name: volsync
      namespace: flux-system
  path: ./kubernetes/apps/monitoring/grafana-operator/instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  postBuild:
    substitute:
      APP: grafana
      VOLSYNC_CLAIM: grafana-pvc
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-nfs-cache
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
  timeout: 5m
