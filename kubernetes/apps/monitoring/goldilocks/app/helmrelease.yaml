---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: monitoring
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: goldilocks
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controller:
      # VolSync movers and GitHub Actions runners are short-lived Jobs, so recommendations for them are useless.
      # Goldilocks must be able to list their owners to recognise and skip them.
      flags:
        ignore-controller-kind: ReplicationSource,ReplicationDestination,EphemeralRunner,EphemeralRunnerSet,AutoscalingRunnerSet,AutoscalingListener
      rbac:
        extraRules:
          - apiGroups: ["volsync.backube"]
            resources: ["replicationsources", "replicationdestinations"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["actions.github.com"]
            resources: ["ephemeralrunners", "ephemeralrunnersets", "autoscalinglisteners", "autoscalingrunnersets"]
            verbs: ["get", "list", "watch"]
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
    dashboard:
      replicaCount: 1
      ingress:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
