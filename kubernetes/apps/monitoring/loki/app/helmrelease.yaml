---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: loki
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      server:
        log_level: info
      commonConfig:
        replication_factor: 1
      compactor:
        working_directory: /var/loki/compactor/retention
        delete_request_store: filesystem
        retention_enabled: true
      ingester:
        chunk_encoding: snappy
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01" # quote
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 7d
        # An oversized log line makes Loki reject the entire promtail batch
        # with a 400, silently dropping unrelated logs alongside it.
        # Truncate oversized lines instead.
        max_line_size: 256KB
        max_line_size_truncate: true
        max_line_size_truncate_identifier: "[truncated]"
    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 288Mi
      persistence:
        enabled: false
      extraVolumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage-loki-0
      extraVolumeMounts:
        - name: storage
          mountPath: /var/loki
    gateway:
      replicas: 0
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    sidecar:
      image:
        repository: ghcr.io/kiwigrid/k8s-sidecar
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
      rules:
        searchNamespace: ALL
