---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app audiobookshelf
  namespace: default
spec:
  path: ./kubernetes/apps/default/audiobookshelf/app
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  prune: true
  wait: false
  interval: 10m
  dependsOn:
    - name: nfs-cache
      namespace: kube-system
    - name: synology-csi
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_LOCAL_SCHEDULE: "20 */6 * * *"
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-nfs-cache
      VOLSYNC_PUID: "568"
      VOLSYNC_PGID: "568"
  components:
    - ../../../../components/volsync
