---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opengist
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: synology-csi
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/default/opengist/app
  patches:
    # Keep the application PVC on Retain, but delete disposable mover volumes.
    - target:
        kind: Replication(Source|Destination)
      patch: |-
        - op: replace
          path: /spec/restic/storageClassName
          value: synology-iscsi-ephemeral
    # DSM snapshots depend on their source LUN remaining present.
    - target:
        kind: ReplicationDestination
      patch: |-
        - op: replace
          path: /spec/restic/cleanupTempPVC
          value: false
  postBuild:
    substitute:
      APP: opengist
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-iscsi-ephemeral
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
