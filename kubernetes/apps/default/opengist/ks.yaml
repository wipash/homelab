---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opengist
spec:
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: nfs-cache
      namespace: kube-system
    - name: synology-csi
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/default/opengist/app
  postBuild:
    substitute:
      APP: opengist
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-nfs-cache
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
