---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./resourceclaimtemplate.yaml
patches:
  - target:
      kind: Replication(Source|Destination)
    patch: |-
      - op: replace
        path: /spec/restic/storageClassName
        value: synology-iscsi-ephemeral
  - target:
      kind: ReplicationDestination
    patch: |-
      - op: replace
        path: /spec/restic/cleanupTempPVC
        value: false
      # Preserve root-owned entries alongside Plex's UID 568 files.
      - op: replace
        path: /spec/restic/moverSecurityContext/runAsUser
        value: 0
