---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbittorrent
  namespace: default
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: nfs-cache
      namespace: kube-system
    - name: volsync
      namespace: flux-system
    - name: synology-csi
      namespace: flux-system
  path: ./kubernetes/apps/default/qbittorrent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_LOCAL_SCHEDULE: "13 * * * *"
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-nfs-cache
      VOLSYNC_PUID: "568"
      VOLSYNC_PGID: "568"
  components:
    - ../../../../components/volsync
