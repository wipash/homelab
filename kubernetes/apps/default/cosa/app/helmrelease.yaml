---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cosa
spec:
  chartRef:
    kind: OCIRepository
    name: cosa
  interval: 1h
  values:
    controllers:
      cosa:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: ghcr.io/wipash/cosa
              tag: sha-104025355e7dc14533a80945ce4bcd2dbd5548c5@sha256:5c487e03c047c17442d47ea704d84d4909c60229040a07143b772a15a7a8223d
            env:
              TZ: Pacific/Auckland
              HOME: /home/sean
              COSA_DATA_DIR: /data/cosa
              COSA_VAULT_DIR: /home/sean/pm
              COSA_PI_DIR: /data/cosa/pi
              COSA_PORT: "8080"
              FORWARDED_ALLOW_IPS: 10.244.0.0/16
              COSA_DAILY_FILENAME: "%Y-%m-%d %a.md"
              COSA_DAILY_FOLDER: "🏢 Workbrain/Daily Journal/%Y/%m/%V"
              COSA_DAILY_TEMPLATE_PATH: "Templates/Daily template.md"
              COSA_HINDSIGHT_URL: https://mem.mcgrath.nz
              COSA_PI_MODELS: '{"fast":{"provider":"openai-codex","model":"gpt-5.6-luna"},"standard":{"provider":"openai-codex","model":"gpt-5.6-terra"},"deep":{"provider":"openai-codex","model":"gpt-5.6-sol"}}'
            envFrom:
              - secretRef:
                  name: cosa-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &httpPort 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *httpPort
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *httpPort
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: Unconfined }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-imagepullsecret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: *httpPort

    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - cosa.mcgrath.nz

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          cosa:
            app:
              - path: /data
              - path: /home/sean
                subPath: home
              - path: /home/sean/pm
                subPath: vault
      tmp:
        type: emptyDir
        advancedMounts:
          cosa:
            app:
              - path: /tmp
