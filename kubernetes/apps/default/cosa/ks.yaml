---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname cosa
  namespace: default
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/volsync
  interval: 10m
  path: "./kubernetes/apps/default/cosa/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: rook-ceph-cluster
      namespace: flux-system
    - name: volsync
      namespace: flux-system
    - name: ghcr-imagepullsecret
      namespace: default
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_LOCAL_SCHEDULE: "47 * * * *"
