---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mosquitto
  namespace: default
spec:
  path: ./kubernetes/apps/default/mosquitto/app
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: false
  interval: 10m
  dependsOn:
    - name: nfs-cache
      namespace: kube-system
    - name: external-secrets-stores
      namespace: kube-system
    - name: synology-csi
      namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      CONTROLLER: StatefulSet
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_LOCAL_SCHEDULE: "42 * * * *"
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-nfs-cache
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
  components:
    - ../../../../components/volsync
