---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cosa2
spec:
  chartRef:
    kind: OCIRepository
    name: cosa2
  interval: 1h
  values:
    controllers:
      cosa2:
        replicas: 1
        strategy: Recreate
        pod:
          enableServiceLinks: false
          terminationGracePeriodSeconds: 30
        containers:
          app:
            image:
              repository: ghcr.io/wipash/cosa2
              tag: main@sha256:f8e7c0c685fb584ca778bf233f863dee8dd4e4e38050dbcfd0abedf33a677266
            env:
              TZ: Pacific/Auckland
              COSA2_PUBLIC_ORIGIN: https://cosa2.mcgrath.nz
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &httpPort 4310
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *httpPort
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-imagepullsecret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: *httpPort

    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - cosa2.mcgrath.nz

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          cosa2:
            app:
              - path: /data
      tmp:
        type: emptyDir
        sizeLimit: 64Mi
        advancedMounts:
          cosa2:
            app:
              - path: /tmp
