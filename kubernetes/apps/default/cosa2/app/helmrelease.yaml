---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cosa2
spec:
  chartRef:
    kind: OCIRepository
    name: cosa2
  interval: 1h
  values:
    controllers:
      cosa2:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          terminationGracePeriodSeconds: 30
        initContainers:
          # The volume root belongs to root with group 1000, so the folders
          # each container mounts are made first, owned by 1000.
          vault-folders:
            image: &syncImage
              repository: ghcr.io/wipash/cosa2-obsidian-sync
              tag: sha-596c63358aacda1280368fe5fe0d1c26c623f6ac@sha256:49b8ac710aef0cb6ba1f9f0bc9a6ee2e367c896bccbe4a1f4111fc70396a3cd3
            command: ["mkdir", "-p", "/vault-volume/notes", "/vault-volume/state"]
            securityContext: &restricted
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/wipash/cosa2
              tag: main@sha256:71019b241b2853dfb594293e713b4b50931f276f88ad8a5a68547e8d4829e1d2
            env:
              TZ: Pacific/Auckland
              COSA2_PUBLIC_ORIGIN: https://cosa2.mcgrath.nz
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &httpPort 4310
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *httpPort
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            securityContext: *restricted
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
          # Keeps /vault in step with the Obsidian Sync vault, download only
          # (mirror-remote). CoSA2 reads it as its notes vault source.
          obsidian-sync:
            image: *syncImage
            env:
              TZ: Pacific/Auckland
              VAULT_PATH: /vault-volume/notes
              XDG_CONFIG_HOME: /vault-volume/state
              HOME: /vault-volume/state
            envFrom:
              - secretRef:
                  name: cosa2-obsidian-secret
            # Each sync is bounded by SYNC_TIMEOUT_SECONDS, and CoSA2 shows a
            # sync that stops succeeding as a problem on the notes source.
            probes:
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }
            securityContext: *restricted
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-imagepullsecret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        ports:
          http:
            port: *httpPort

    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - cosa2.mcgrath.nz

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          cosa2:
            app:
              - path: /data
      vault:
        existingClaim: cosa2-vault
        advancedMounts:
          cosa2:
            vault-folders:
              - path: /vault-volume
            obsidian-sync:
              - path: /vault-volume
            app:
              - path: /vault
                subPath: notes
                readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 64Mi
        advancedMounts:
          cosa2:
            app:
              - path: /tmp
            obsidian-sync:
              - path: /tmp
