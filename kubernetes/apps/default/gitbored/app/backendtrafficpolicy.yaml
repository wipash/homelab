---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gitbored
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gitbored
  # Keeps the gateway policy's compression, keepalive and timeouts, and only turns off its retries:
  # replaying a reset POST, such as an MCP tool call, could apply it twice.
  mergeType: StrategicMerge
  retry:
    numRetries: 0
