---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: cups-config
    files:
      - cupsctl=./resources/cupsctl
generatorOptions:
  disableNameSuffixHash: true
