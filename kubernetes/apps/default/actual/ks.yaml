---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname actual
  namespace: default
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  components:
    - ../../../../components/volsync
  interval: 10m
  path: "./kubernetes/apps/default/actual/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: synology-csi
      namespace: flux-system
    - name: volsync
      namespace: flux-system
    - name: external-secrets-stores
      namespace: kube-system
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_LOCAL_SCHEDULE: "45 * * * *"
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-iscsi-ephemeral
      VOLSYNC_PUID: "568"
      VOLSYNC_PGID: "568"
