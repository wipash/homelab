---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee2mqtt
  namespace: default
spec:
  targetNamespace: default
  dependsOn:
    - name: nfs-cache
      namespace: kube-system
    - name: external-secrets-stores
      namespace: kube-system
    - name: node-feature-discovery-rules
      namespace: kube-system
    - name: synology-csi
      namespace: flux-system
  path: ./kubernetes/apps/default/zigbee2mqtt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_LOCAL_SCHEDULE: "3 * * * *"
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-nfs-cache
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
  components:
    - ../../../../components/volsync
