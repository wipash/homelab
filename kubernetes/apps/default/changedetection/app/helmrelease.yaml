---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  chartRef:
    kind: OCIRepository
    name: changedetection
  interval: 1h
  values:
    controllers:
      changedetection:
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.70.2@sha256:36ebb3586e9a6b14af6fb488c6e29b60eceb79ee414ecdb6ac2b91dd25b1c7ba
            env:
              TZ: Pacific/Auckland
              PORT: &port 5000
              USE_X_SETTINGS: 1
              FETCH_WORKERS: 3
              PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/?stealth=1&--disable-web-security=true
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
            # securityContext:
            #   allowPrivilegeEscalation: false
            #   capabilities: { drop: ["ALL"] }
            #   readOnlyRootFilesystem: true

          browser:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.58.1@sha256:f2950a079c3172339f1dfeac597b64ee0561e0843acb956ffec235b93bf77aff
              pullPolicy: IfNotPresent
            env:
              TIMEOUT: "60000"
              # headroom above FETCH_WORKERS: each check can open more than one
              # CDP connection, and connections beyond the limit are refused
              CONCURRENT: "6"
              SCREEN_WIDTH: "1920"
              SCREEN_HEIGHT: "1024"
              SCREEN_DEPTH: "16"
              ENABLE_DEBUGGER: "false"
              PREBOOT_CHROME: "true"
              DEFAULT_BLOCK_ADS: "true"
              DEFAULT_STEALTH: "true"

            resources:
              requests:
                cpu: 100m
                memory: 1100Mi

            # securityContext:
            #   allowPrivilegeEscalation: false

    # defaultPodOptions:
    #   securityContext:
    #     runAsNonRoot: true
    #     runAsUser: 1000
    #     runAsGroup: 1000
    #     fsGroup: 1000
    #     fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: changedetection
        ports:
          http:
            port: *port

    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        hostnames:
          - "{{ .Release.Name }}.mcgrath.nz"

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          changedetection:
            app:
              - path: /datastore
                subPath: changedetection

      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
