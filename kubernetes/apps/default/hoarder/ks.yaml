---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hoarder
  namespace: default
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: nfs-cache
      namespace: kube-system
    - name: synology-csi
      namespace: flux-system
    - name: volsync
      namespace: flux-system
    - name: external-secrets-stores
      namespace: kube-system
  path: ./kubernetes/apps/default/hoarder/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_LOCAL_SCHEDULE: "35 * * * *"
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_STORAGECLASS: synology-iscsi
      VOLSYNC_SNAPSHOTCLASS: synology-iscsi
      VOLSYNC_CACHE_SNAPSHOTCLASS: synology-nfs-cache
  components:
    - ../../../../components/volsync
