---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: synology-csi
resources:
  # Synology CSI v1.3.1; exclude upstream default class and common snapshot controller.
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/d6e51755fb09dc8e6979aa4f7e14649158c1b6a3/deploy/kubernetes/v1.20/csi-driver.yml
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/d6e51755fb09dc8e6979aa4f7e14649158c1b6a3/deploy/kubernetes/v1.20/controller.yml
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/d6e51755fb09dc8e6979aa4f7e14649158c1b6a3/deploy/kubernetes/v1.20/node.yml
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/d6e51755fb09dc8e6979aa4f7e14649158c1b6a3/deploy/kubernetes/v1.20/snapshotter/snapshotter.yaml
  - ./externalsecret.yaml
  - ./storage.yaml
images:
  - name: synology/synology-csi
    newTag: v1.3.1
    digest: sha256:8aa84848187648a65c899f54e96061d3f22cdba0ad8926d770b431d4b274406f
  - name: registry.k8s.io/sig-storage/csi-snapshotter
    newTag: v8.6.0
    digest: sha256:42af0929bcd60a43499825c078a60ff0534e08af8fbeb283aa391be40feb9f3e
configMapGenerator:
  - name: synology-csi-iscsiadm-wrapper
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - iscsiadm=iscsiadm-wrapper.sh
patches:
  - target:
      kind: StatefulSet
      name: synology-csi-controller
    patch: |-
      # Bound provisioning concurrency to avoid overwhelming DSM at target limits.
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: --timeout=5m
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --worker-threads=1
  - target:
      kind: StatefulSet
      name: synology-csi-snapshotter
    patch: |-
      # Snapshot lookup scans every LUN; avoid concurrent full-inventory retries.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --worker-threads=1
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --timeout=5m
  - target:
      kind: DaemonSet
      name: synology-csi-node
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - operator: Exists
      # Wrap host iscsiadm with flock inside the container (Talos /host has no sh/flock).
      - op: test
        path: /spec/template/spec/containers/1/name
        value: csi-plugin
      - op: test
        path: /spec/template/spec/containers/1/args/5
        value: --chroot-dir=/host
      - op: replace
        path: /spec/template/spec/containers/1/args/5
        value: --chroot-dir=
      - op: add
        path: /spec/template/spec/containers/1/args/-
        value: --multipath=false
      - op: add
        path: /spec/template/spec/containers/1/args/-
        value: --iscsiadm-path=/opt/iscsiadm-wrapper/iscsiadm
      - op: add
        path: /spec/template/spec/containers/1/volumeMounts/-
        value:
          name: iscsiadm-wrapper
          mountPath: /opt/iscsiadm-wrapper
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: iscsiadm-wrapper
          configMap:
            name: synology-csi-iscsiadm-wrapper
            defaultMode: 493
  - target:
      kind: ClusterRole
      name: synology-csi-snapshotter-role
    patch: |-
      - op: add
        path: /rules/2/verbs/-
        value: patch
      - op: add
        path: /rules/3/verbs/-
        value: patch
