---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-router
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-router-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-router
subjects:
  - kind: ServiceAccount
    name: tailscale-router
    namespace: networking
