---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tailscale-router
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale-router
  interval: 1h
  values:
    controllers:
      tailscale-router:
        replicas: 1
        strategy: Recreate
        serviceAccount:
          identifier: *app
        initContainers:
          sysctler:
            image: &image
              repository: ghcr.io/tailscale/tailscale
              tag: v1.102.4@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
            command: ["/bin/sh", "-c"]
            args:
              - sysctl -w net.ipv4.ip_forward=1 && if sysctl net.ipv6.conf.all.forwarding; then sysctl -w net.ipv6.conf.all.forwarding=1; fi
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image: *image
            env:
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    name: tailscale-router-auth
                    key: TS_AUTHKEY
              TS_KUBE_SECRET: tailscale-router-state
              TS_AUTH_ONCE: "true"
              TS_USERSPACE: "false"
              TS_ACCEPT_DNS: "false"
              TS_HOSTNAME: ts-pod-cidrs
              TS_EXTRA_ARGS: --login-server=https://hs.mcgrath.nz --advertise-tags=tag:homelab-router --advertise-exit-node --accept-routes=false
              TS_ROUTES: 10.0.16.0/24,10.0.10.0/24,10.244.0.0/16,172.16.10.0/24
              TS_ENABLE_HEALTH_CHECK: "true"
              TS_LOCAL_ADDR_PORT: 0.0.0.0:9002
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9002
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              # Containerboot exits if tailscaled fails; control outages must not trigger restarts.
              liveness:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                # Containerboot creates /dev/net/tun; tailscaled configures pod-local routing.
                add: ["NET_ADMIN", "MKNOD"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    serviceAccount:
      tailscale-router:
        forceRename: tailscale-router
    defaultPodOptions:
      automountServiceAccountToken: true
      hostNetwork: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
