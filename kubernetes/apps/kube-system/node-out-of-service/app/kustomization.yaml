---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: node-out-of-service-scripts
    files:
      - ./taint-out-of-service.sh
generatorOptions:
  disableNameSuffixHash: true
