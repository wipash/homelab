---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-cache-provisioner-root
spec:
  accessModes: ["ReadWriteMany"]
  capacity:
    # NFS has no per-directory quota; this value only binds the provisioner's
    # root PVC and does not limit the export.
    storage: 1Gi
  claimRef:
    name: nfs-cache-provisioner-root
    namespace: kube-system
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 10.0.16.16
    path: /volume3/volsync-cache
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-cache-provisioner-root
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: nfs-cache-provisioner-root
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-nfs-cache
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: mcgrath.nz/synology-nfs-cache
parameters:
  # Deliberately omit pathPattern: the upstream default includes the generated
  # PV name, giving every PVC a unique namespace-pvc-pv directory.
  archiveOnDelete: "false"
reclaimPolicy: Delete
allowVolumeExpansion: false
mountOptions:
  - nfsvers=4.1
  - hard
volumeBindingMode: Immediate
