---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
  annotations:
    # Removing the obsolete storage health gate reset a terminal failure.
    # Require an explicit retry decision before another v1.37.0 attempt.
    tuppr.home-operations.com/suspend: "true"
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.0
  maintenance:
    windows:
      - start: "0 3 * * 0"
        duration: 4h
        timezone: Pacific/Auckland
