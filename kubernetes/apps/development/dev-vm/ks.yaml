---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-vm
  namespace: development
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: dev-vm
  dependsOn:
    - name: cdi
      namespace: cdi
    - name: external-secrets-stores
      namespace: kube-system
    - name: kubevirt
      namespace: kubevirt
    - name: rook-ceph-cluster
      namespace: flux-system
    - name: volsync
      namespace: flux-system
  healthChecks:
    - apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      name: dev-vm
      namespace: development
  interval: 30m
  path: ./kubernetes/apps/development/dev-vm/app
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: development
  timeout: 30m
  wait: true
