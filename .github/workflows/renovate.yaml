---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Renovate"

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: false
      logLevel:
        description: Log Level
        default: info
        required: false
      version:
        description: Renovate version
        default: latest
        required: false
  schedule:
    - cron: "0 * * * *" # Every hour
  push:
    branches: ["main"]
    paths:
      - .github/renovate-config.json5
      - .github/renovate.json5
      - .github/renovate/**.json5

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  LOG_LEVEL: "${{ inputs.logLevel || 'info' }}"
  RENOVATE_DRY_RUN: "${{ inputs.dryRun && 'full' || '' }}"
  RENOVATE_PLATFORM: github
  RENOVATE_PLATFORM_COMMIT: enabled
  RENOVATE_INTERNAL_CHECKS_FILTER: strict
  RENOVATE_REPOSITORIES: "${{ github.repository }}"
  RENOVATE_REPOSITORY_CACHE: enabled
  RENOVATE_USERNAME: "${{ secrets.BOT_USERNAME }}[bot]"
  RENOVATE_GIT_AUTHOR: "${{ secrets.BOT_USERNAME }} <${{ secrets.BOT_USER_ID }}+${{ secrets.BOT_USERNAME }}[bot]@users.noreply.github.com>"
  WORKFLOW_RENOVATE_VERSION: "${{ inputs.version || 'latest' }}"

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Restore Renovate cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate
          key: renovate-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            renovate-cache-v1-

      - name: Prepare Renovate cache
        run: |
          mkdir -p /tmp/renovate/cache/renovate
          sudo chown -R 12021:0 /tmp/renovate

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: "${{ steps.app-token.outputs.token }}"

      - name: Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        env:
          # The CoSA package grants this repository Actions read access.
          # Use the short-lived workflow token for GHCR, not the GitHub App token.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"ghcr.io","username":${{ toJSON(github.actor) }},"password":${{ toJSON(github.token) }}}]
        with:
          configurationFile: .github/renovate-config.json5
          token: "${{ steps.app-token.outputs.token }}"
          renovate-version: "${{ env.WORKFLOW_RENOVATE_VERSION }}"

      - name: Save Renovate cache
        if: ${{ success() && env.RENOVATE_DRY_RUN == '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate/cache/renovate
          key: renovate-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
